config:
  validation: true
  warningsAsErrors: false
  excludes: []

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 30
  LongMethod:
    active: true
    allowedLines: 140
  LongParameterList:
    active: true
    allowedFunctionParameters: 12
    allowedConstructorParameters: 12
  NestedBlockDepth:
    active: true
    allowedDepth: 7
  TooManyFunctions:
    active: false
    allowedFunctionsPerClass: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerEnum: 20

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: false

exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException
      - Throwable
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException
      - Throwable

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  WildcardImport:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    excludes:
      - "**/runtime/NativeBindings.kt"
      - "**/ffi/WatcherJni.kt"
