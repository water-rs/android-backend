name: Nightly

# The on-device suite, once a day against `dev` and on demand — the same
# contract the waterui repo's `nightly.yml` keeps: heavyweight coverage that
# no pull request should pay for runs here instead, and a red run opens one
# tracking issue rather than failing silently. `ci.yml` stays the fast gate.
#
# `golden_mode: record` on a manual dispatch captures every verify-mode
# example's settled frame into the `android-e2e-artifacts-shard-*` artifacts
# under `candidates/` — the bootstrap path for introducing or updating a
# golden image (download, move to `e2e/goldens/`, commit).

on:
  # Off-peak UTC, staggered against the waterui nightly (03:17) and bench
  # (05:41) schedules so the emulator fleet does not compete for the org's
  # job cap.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      golden_mode:
        description: "enforce compares against e2e/goldens; record captures candidates instead"
        type: choice
        options:
          - enforce
          - record
        default: enforce

permissions:
  contents: read
  # The failure report below opens or updates an issue.
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  AVD_API_LEVEL: "35"
  AVD_ARCH: x86_64
  AVD_TARGET: google_apis
  AVD_PROFILE: pixel_6

jobs:
  e2e:
    name: Example E2E
    uses: ./.github/workflows/android-e2e.yml
    with:
      waterui-ref: dev
      golden_mode: ${{ inputs.golden_mode || 'enforce' }}

  # The androidTest suite: a real device run of the runtime against the app
  # crate's .so — the JNI boundary, view inflation, and the gesture → binding →
  # watcher reactive loop that Robolectric can never reach. The gesture
  # example doubles as the test fixture.
  instrumentation:
    name: Runtime instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout waterui (dev)
        uses: actions/checkout@v4
        with:
          repository: water-rs/waterui
          ref: dev
          path: waterui
          submodules: recursive

      - name: Overlay android-backend
        uses: actions/checkout@v4
        with:
          path: waterui/backends/android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-e2e
          workspaces: |
            waterui

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default `tools platform-tools` names the legacy
          # `tools` package, which Google has removed from the SDK
          # repository manifest — install only platform-tools (adb); the
          # workflows fetch platforms, build-tools, NDK, emulator and
          # system images explicitly below.
          packages: 'platform-tools'

      # The generated app and this module both compile against compileSdk 37,
      # and the instrumentation build packages the staged .so through the NDK
      # toolchain — derive the pinned NDK from the module rather than
      # duplicating the version here.
      - name: Install SDK platform, build-tools, and the pinned NDK
        run: |
          # compileSdk is the source of truth; since API 37 the platform
          # package carries a minor suffix (platforms;android-37.0), so resolve
          # the newest package matching the declared major level.
          compile_sdk="$(sed -n 's/.*compileSdk = \([0-9][0-9]*\).*/\1/p' waterui/backends/android/runtime/build.gradle.kts)"
          platform_pkg="$(sdkmanager --list | grep -oE "platforms;android-${compile_sdk}(\.[0-9]+)?" | sort -Vu | tail -1)"
          if [ -z "$platform_pkg" ]; then
            echo "::error::No installable SDK platform for compileSdk ${compile_sdk}"
            exit 1
          fi
          sdkmanager --install "$platform_pkg"
          latest_bt="$(sdkmanager --list | awk -F'|' '{id=$1; gsub(/ /,"",id); if (id ~ /^build-tools;[0-9.]+$/) print id}' | sort -Vu | tail -1)"
          sdkmanager --install "$latest_bt"
          ndk_version="$(sed -n 's/.*ndkVersion = "\(.*\)"/\1/p' waterui/backends/android/runtime/build.gradle.kts)"
          sdkmanager --install "ndk;${ndk_version}"

      - name: Install the Android Rust targets
        run: rustup target add $(python3 waterui/backends/android/scripts/ci/e2e.py rust-target all)

      # The example build's host-side build scripts link native libraries
      # (libva through waterkit-codec, fonts, EGL, …); the script reuses the
      # package list the waterui checkout maintains rather than drifting a copy.
      - name: Install Linux native dependencies
        run: python3 waterui/backends/android/scripts/ci/install_linux_deps.py waterui

      # `water` ships from water-rs/cli now — install the `dev` head rather
      # than building a workspace member. The binary rides its own
      # actions/cache entry keyed on the resolved cli commit: a hit skips
      # the compile entirely, a `dev` move misses and rebuilds.
      - name: Resolve the water-rs/cli dev commit
        id: cli-rev
        run: echo "rev=$(git ls-remote https://github.com/water-rs/cli refs/heads/dev | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the water binary
        id: water-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/water
            ~/.cargo/bin/water.exe
          key: water-cli-${{ runner.os }}-${{ steps.cli-rev.outputs.rev }}

      # `serialport` (the cli's default `esp32` feature) builds `libudev-sys`,
      # whose build script needs `libudev` via pkg-config — absent from the
      # ubuntu-latest image. Keep default features so CI builds what a user's
      # `cargo install waterui-cli` produces.
      - name: Install libudev for the CLI's serialport dependency
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install the water CLI
        if: steps.water-cache.outputs.cache-hit != 'true'
        run: |
          rm -f "$HOME/.cargo/bin/water" "$HOME/.cargo/bin/water.exe"
          cargo install --locked \
            --git https://github.com/water-rs/cli --branch dev \
            waterui-cli

      - name: Build the gesture fixture's native library
        run: water package --platform android --backend android --arch x86-64 --path waterui/examples/gesture

      # Playground examples keep their generated backend under the CLI's
      # build cache, so locate the staged ABI directory rather than assuming a
      # path inside the example checkout.
      - name: Stage the native library into the test APK
        run: |
          abi_dir="$(find "$HOME/.water/build_cache" -type d -path '*managed_backends/android/app/src/main/jniLibs/x86_64' -print -quit)"
          if [ -z "$abi_dir" ]; then
            echo "::error::water package produced no x86_64 jniLibs directory"
            exit 1
          fi
          dest="waterui/backends/android/runtime/src/androidTest/jniLibs/x86_64"
          mkdir -p "$dest"
          cp "$abi_dir"/*.so "$dest/"
          ls -la "$dest"

      # Host-side guard for the waterui#834 failure mode: a Kotlin
      # `external fun` whose `Java_*` export went missing detonates
      # on-device as UnsatisfiedLinkError, so diff the staged .so's
      # exports against the declarations before spending emulator time.
      - name: Check JNI symbol coverage
        run: python3 waterui/backends/android/scripts/ci/check_jni_symbols.py waterui/backends/android/runtime/src/androidTest/jniLibs/x86_64/libwaterui_app.so waterui/backends/android/runtime/src/main/java

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create emulator snapshot for cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          arch: ${{ env.AVD_ARCH }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "AVD cache primed."

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          arch: ${{ env.AVD_ARCH }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Each `script:` line runs through a fresh `/usr/bin/sh -c`, so this
          # stays a single line — a `cd` on its own line would be forgotten.
          script: cd waterui/backends/android && ./gradlew --no-daemon :runtime:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            waterui/backends/android/runtime/build/reports/androidTests/
            waterui/backends/android/runtime/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # Release package size: the gesture example packaged with
  # `water package --release` so the R8/LTO/strip numbers trend nightly
  # instead of being measured once. Runs in parallel with the emulator
  # shards — it never touches a device.
  release-metrics:
    name: Release package metrics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout waterui (dev)
        uses: actions/checkout@v4
        with:
          repository: water-rs/waterui
          ref: dev
          path: waterui
          submodules: recursive

      - name: Overlay android-backend
        uses: actions/checkout@v4
        with:
          path: waterui/backends/android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-e2e
          workspaces: |
            waterui

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default `tools platform-tools` names the legacy
          # `tools` package, which Google has removed from the SDK
          # repository manifest — install only platform-tools (adb); the
          # workflows fetch platforms, build-tools, NDK, emulator and
          # system images explicitly below.
          packages: 'platform-tools'

      - name: Install SDK platform, build-tools, and the pinned NDK
        run: |
          compile_sdk="$(sed -n 's/.*compileSdk = \([0-9][0-9]*\).*/\1/p' waterui/backends/android/runtime/build.gradle.kts)"
          platform_pkg="$(sdkmanager --list | grep -oE "platforms;android-${compile_sdk}(\.[0-9]+)?" | sort -Vu | tail -1)"
          if [ -z "$platform_pkg" ]; then
            echo "::error::No installable SDK platform for compileSdk ${compile_sdk}"
            exit 1
          fi
          sdkmanager --install "$platform_pkg"
          latest_bt="$(sdkmanager --list | awk -F'|' '{id=$1; gsub(/ /,"",id); if (id ~ /^build-tools;[0-9.]+$/) print id}' | sort -Vu | tail -1)"
          sdkmanager --install "$latest_bt"
          ndk_version="$(sed -n 's/.*ndkVersion = "\(.*\)"/\1/p' waterui/backends/android/runtime/build.gradle.kts)"
          sdkmanager --install "ndk;${ndk_version}"

      - name: Install the Android Rust targets
        run: rustup target add $(python3 waterui/backends/android/scripts/ci/e2e.py rust-target all)

      # The example build's host-side build scripts link native libraries
      # (libva through waterkit-codec, fonts, EGL, …); the script reuses the
      # package list the waterui checkout maintains rather than drifting a copy.
      - name: Install Linux native dependencies
        run: python3 waterui/backends/android/scripts/ci/install_linux_deps.py waterui

      # `water` ships from water-rs/cli now — install the `dev` head rather
      # than building a workspace member. The binary rides its own
      # actions/cache entry keyed on the resolved cli commit: a hit skips
      # the compile entirely, a `dev` move misses and rebuilds.
      - name: Resolve the water-rs/cli dev commit
        id: cli-rev
        run: echo "rev=$(git ls-remote https://github.com/water-rs/cli refs/heads/dev | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the water binary
        id: water-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/water
            ~/.cargo/bin/water.exe
          key: water-cli-${{ runner.os }}-${{ steps.cli-rev.outputs.rev }}

      # `serialport` (the cli's default `esp32` feature) builds `libudev-sys`,
      # whose build script needs `libudev` via pkg-config — absent from the
      # ubuntu-latest image. Keep default features so CI builds what a user's
      # `cargo install waterui-cli` produces.
      - name: Install libudev for the CLI's serialport dependency
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install the water CLI
        if: steps.water-cache.outputs.cache-hit != 'true'
        run: |
          rm -f "$HOME/.cargo/bin/water" "$HOME/.cargo/bin/water.exe"
          cargo install --locked \
            --git https://github.com/water-rs/cli --branch dev \
            waterui-cli

      - name: Package the release APK and record its size
        run: |
          echo "/tmp/water-cli" >> "$GITHUB_PATH"
          mkdir -p /tmp/water-cli
          cp "$HOME/.cargo/bin/water" /tmp/water-cli/water
          python3 waterui/backends/android/scripts/ci/release_metrics.py --repo-root waterui --example gesture --out release-metrics.json

      - name: Upload release metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-metrics
          path: release-metrics.json
          if-no-files-found: ignore

  # Merge every shard's per-example metrics plus the release package record
  # into nightly-metrics.json and a step summary — the numbers are the point
  # of the run, so this renders even when examples fail.
  metrics:
    name: Metrics summary
    needs: [e2e, release-metrics]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download shard + release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-e2e-artifacts-shard-*
          path: /tmp/nightly-artifacts
          merge-multiple: false

      - name: Download release metrics artifact
        uses: actions/download-artifact@v4
        # The release-metrics leg is best-effort; a missing artifact must not
        # fail the summary. `continue-on-error` is a step property, not an
        # action input — under `with:` it was ignored and the step failed hard.
        continue-on-error: true
        with:
          name: release-metrics
          path: /tmp/nightly-artifacts/release

      - name: Aggregate metrics
        run: python3 scripts/ci/aggregate_metrics.py --artifacts-root /tmp/nightly-artifacts --out nightly-metrics.json

      - name: Upload merged metrics
        uses: actions/upload-artifact@v4
        with:
          name: nightly-metrics
          path: nightly-metrics.json

  # One issue per broken nightly, updated in place while it stays red, so a
  # failure that nobody was watching is on the board by morning.
  report:
    name: Report failure
    needs: [e2e, instrumentation]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/NIGHTLY_FAILURE.md
          update_existing: true
          search_existing: open
