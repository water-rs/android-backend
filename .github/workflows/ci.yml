name: Android Backend CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android-static:
    name: android-static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android-backend repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Static analysis and unit tests
        run: ./gradlew --no-daemon :runtime:detekt :runtime:lintDebug :runtime:testDebugUnitTest

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android-backend repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release artifacts
        run: ./gradlew --no-daemon :runtime:assembleDebug :runtime:assembleRelease
